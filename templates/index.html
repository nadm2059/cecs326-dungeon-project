<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Process Dungeon Simulator</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            padding: 20px;
        }
        #terminal {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #38bdf8;
            /* CRITICAL: Preserves line breaks and formatting */
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
        }
        button {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

    <h2>Multi-Process Dungeon Simulator</h2>
    <button id="startBtn" onclick="runSimulation()">Start Simulation</button>

    <div id="terminal">> Awaiting simulation start...</div>

    <script>
        function runSimulation() {
            const terminal = document.getElementById('terminal');
            terminal.textContent = '> Launching C Engine & Spawning Party...\n\n';

            const eventSource = new EventSource('/stream-game');

            eventSource.onmessage = function(event) {
                // Append line with explicit newline
                if (event.data === `[FINISHED]`) {
                    eventSource.close();
                    return;
                }
                terminal.textContent += event.data + '\n';
                // Auto-scroll to bottom as output logs arrive
                terminal.scrollTop = terminal.scrollHeight;
            };

            eventSource.onerror = function() {
                eventSource.close();
            };
        }
    </script>
</body>
</html>
