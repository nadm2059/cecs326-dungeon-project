<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Process Dungeon Simulator - 2D Canvas Engine</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel-bg: #111827;
            --border: #1f2937;
            --text: #f3f4f6;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h2 { margin: 0; font-size: 1.5rem; letter-spacing: -0.025em; }

        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover { background-color: #047857; }
        button:active { transform: scale(0.98); }

        /* Canvas Stage */
        #canvas-container {
            position: relative;
            background-color: #030712;
            border: 2px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Terminal Output */
        #terminal {
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #38bdf8;
            white-space: pre-wrap;
            word-wrap: break-word;
            height: 240px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚔️ Multi-Process Dungeon Engine</h2>
        <button id="startBtn" onclick="runSimulation()">Start Simulation</button>
    </div>

    <!-- 2D Computer Graphics Arena -->
    <div id="canvas-container">
        <canvas id="dungeonCanvas" width="800" height="300"></canvas>
    </div>

    <!-- Process Output Stream -->
    <div id="terminal">> Awaiting simulation start...</div>

    <script>
        const canvas = document.getElementById('dungeonCanvas');
        const ctx = canvas.getContext('2d');

        // --- Particle System ---
        const particles = [];
        function createParticles(x, y, color, count = 15, speedMultiplier = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 3 + 1) * speedMultiplier;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.02
                });
            }
        }

        // --- Character Sprite Entities ---
        const heroes = {
            barbarian: {
                name: 'Barbarian',
                emoji: '🪓',
                homeX: 100, homeY: 150,
                x: 100, y: 150,
                targetX: 100, targetY: 150,
                color: '#ef4444',
                status: 'Ready'
            },
            wizard: {
                name: 'Wizard',
                emoji: '🧙‍♂️',
                homeX: 100, homeY: 80,
                x: 100, y: 80,
                targetX: 100, targetY: 80,
                color: '#a855f7',
                status: 'Ready'
            },
            rogue: {
                name: 'Rogue',
                emoji: '🗡️',
                homeX: 100, homeY: 220,
                x: 100, y: 220,
                targetX: 100, targetY: 220,
                color: '#10b981',
                status: 'Ready'
            }
        };

        const targetArea = { x: 550, y: 150, radius: 40 };

        // --- Render Loop (60 FPS Graphics) ---
        function drawDungeon() {
            // Clear Background
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Dungeon Tile Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const tileSize = 40;
            for (let x = 0; x < canvas.width; x += tileSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += tileSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Target Zone / Door
            ctx.save();
            ctx.strokeStyle = '#334155';
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(targetArea.x, targetArea.y, targetArea.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚪', targetArea.x, targetArea.y);
            ctx.restore();

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Update & Draw Heroes
            Object.values(heroes).forEach(hero => {
                // Smooth Movement Vector Interpolation (Lerp)
                hero.x += (hero.targetX - hero.x) * 0.15;
                hero.y += (hero.targetY - hero.y) * 0.15;

                // Auto-return home if close to target
                if (Math.hypot(hero.targetX - hero.x, hero.targetY - hero.y) < 2 && hero.targetX !== hero.homeX) {
                    hero.targetX = hero.homeX;
                    hero.targetY = hero.homeY;
                }

                ctx.save();
                // Draw Character Aura / Shadow
                ctx.fillStyle = hero.color;
                ctx.globalAlpha = 0.2;
                ctx.beginPath();
                ctx.arc(hero.x, hero.y + 15, 18, 0, Math.PI * 2);
                ctx.fill();

                // Draw Emoji Sprite
                ctx.globalAlpha = 1.0;
                ctx.font = '32px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(hero.emoji, hero.x, hero.y);

                // Draw Label & Status
                ctx.font = '11px sans-serif';
                ctx.fillStyle = hero.color;
                ctx.fillText(hero.name, hero.x, hero.y - 28);
                ctx.restore();
            });

            requestAnimationFrame(drawDungeon);
        }

        // Start 60 FPS Render Loop
        drawDungeon();

        // --- Action Trigger Functions ---
        function triggerAction(heroKey, actionType) {
            const hero = heroes[heroKey];
            if (!hero) return;

            if (actionType === 'attack') { // Barbarian Lunge
                hero.targetX = targetArea.x - 40;
                hero.targetY = targetArea.y + 10;
                setTimeout(() => {
                    createParticles(targetArea.x - 20, targetArea.y, '#ef4444', 20, 1.5);
                }, 150);
            } 
            else if (actionType === 'cast') { // Wizard Magic Beam
                hero.targetX = hero.homeX + 60;
                setTimeout(() => {
                    // Fire particle beam toward door
                    for (let x = hero.x + 20; x < targetArea.x; x += 15) {
                        createParticles(x, hero.y + (Math.random() * 10 - 5), '#a855f7', 3, 0.5);
                    }
                }, 100);
            } 
            else if (actionType === 'dash') { // Rogue Lockpick / Sweep
                hero.targetX = targetArea.x - 10;
                hero.targetY = targetArea.y - 30;
                setTimeout(() => {
                    createParticles(targetArea.x, targetArea.y - 20, '#10b981', 15, 1.2);
                }, 200);
            }
        }

        // --- SSE Stream Handler ---
        function runSimulation() {
            const terminal = document.getElementById('terminal');
            terminal.textContent = '> Launching C Engine & Spawning Party...\n\n';

            const eventSource = new EventSource('/stream-game');

            eventSource.onmessage = function(event) {
                if (event.data === '[FINISHED]') {
                    eventSource.close();
                    terminal.textContent += '\n> Simulation sequence complete.\n';
                    return;
                }

                const line = event.data;
                terminal.textContent += line + '\n';
                terminal.scrollTop = terminal.scrollHeight;

                // Match log events to graphics actions
                if (line.includes('[Barbarian]') || line.includes('barbarian')) {
                    triggerAction('barbarian', 'attack');
                } 
                else if (line.includes('[Wizard]') || line.includes('wizard')) {
                    triggerAction('wizard', 'cast');
                } 
                else if (line.includes('[Rogue]') || line.includes('rogue')) {
                    triggerAction('rogue', 'dash');
                }
            };

            eventSource.onerror = function() {
                eventSource.close();
            };
        }
    </script>
</body>
</html>
