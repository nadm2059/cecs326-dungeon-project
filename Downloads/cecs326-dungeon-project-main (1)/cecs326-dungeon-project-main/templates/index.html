<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Simulator Console</title>
    <style>
        body { background-color: #0d1117; color: #58a6ff; font-family: monospace; padding: 20px; }
        #terminal { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 6px; height: 500px; overflow-y: auto; white-space: pre-wrap; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <h1>Multi-Process Dungeon Simulator</h1>
    <button onclick="runDungeon()">Start Simulation</button>
    <div id="terminal">> System initialized. Click 'Start Simulation' to run...</div>

    <script>
        function runDungeon() {
            const terminal = document.getElementById('terminal');
            terminal.innerText = "> Launching C Engine & Spawning Party...\n\n";
            
            const eventSource = new EventSource('/stream-game');
            
            eventSource.onmessage = function(event) {
                terminal.innerText += event.data;
                terminal.scrollTop = terminal.scrollHeight;
            };

            eventSource.onerror = function() {
                eventSource.close();
                terminal.innerText += "\n> Simulation run finished.";
            };
        }
    </script>
</body>
</html>
